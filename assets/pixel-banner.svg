<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pixel art backend developer banner</title>
  <desc id="desc">Retro terminal banner with servers, data pipelines, and C sharp ASP.NET Core backend theme.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1d2d43" stroke-width="1"/>
    </pattern>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#101c2c" opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0D1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="280" fill="none" stroke="#22D3EE" stroke-width="4"/>
  <path d="M10 32 V10 H34 M1166 10 H1190 V34 M10 266 V290 H34 M1166 290 H1190 V266" stroke="#A78BFA" stroke-width="7" fill="none"/>

  <!-- Pixel points floating in the terminal sky -->
  <g fill="#22D3EE" opacity="0.8">
    <rect x="292" y="35" width="6" height="6"/>
    <rect x="890" y="55" width="5" height="5"/>
    <rect x="1140" y="45" width="8" height="8"/>
    <rect x="280" y="250" width="4" height="4"/>
    <rect x="735" y="25" width="4" height="4"/>
  </g>
  <g fill="#A78BFA" opacity="0.9">
    <rect x="875" y="250" width="6" height="6"/>
    <rect x="305" y="212" width="5" height="5"/>
    <rect x="1160" y="245" width="6" height="6"/>
  </g>

  <!-- SERVER RACK in an 8-bit frame -->
  <rect x="37" y="37" width="212" height="226" fill="#071320" stroke="#A78BFA" stroke-width="5"/>
  <rect x="50" y="50" width="186" height="26" fill="#162238"/>
  <text x="61" y="68" font-family="monospace" font-weight="bold" font-size="14" fill="#A78BFA" letter-spacing="2">SERVER_ROOM</text>
  <g>
    <rect x="58" y="88" width="169" height="40" fill="#182b41" stroke="#4B6380" stroke-width="3"/>
    <rect x="70" y="100" width="35" height="16" fill="#0D1117"/>
    <rect x="75" y="105" width="6" height="6" fill="#22c55e"/>
    <rect x="87" y="105" width="6" height="6" fill="#22D3EE"/>
    <rect x="176" y="104" width="38" height="8" fill="#A78BFA"/>

    <rect x="58" y="138" width="169" height="40" fill="#182b41" stroke="#4B6380" stroke-width="3"/>
    <rect x="70" y="150" width="35" height="16" fill="#0D1117"/>
    <rect x="75" y="155" width="6" height="6" fill="#22c55e"/>
    <rect x="87" y="155" width="6" height="6" fill="#22c55e"/>
    <rect x="176" y="154" width="38" height="8" fill="#22D3EE"/>

    <rect x="58" y="188" width="169" height="40" fill="#182b41" stroke="#4B6380" stroke-width="3"/>
    <rect x="70" y="200" width="35" height="16" fill="#0D1117"/>
    <rect x="75" y="205" width="6" height="6" fill="#22c55e"/>
    <rect x="87" y="205" width="6" height="6" fill="#22D3EE"/>
    <rect x="176" y="204" width="38" height="8" fill="#22c55e"/>
  </g>
  <rect x="65" y="239" width="147" height="8" fill="#22c55e" opacity="0.8"/>

  <!-- Terminal and arcade title -->
  <text x="291" y="76" font-family="'Courier New',monospace" font-weight="bold" font-size="44" letter-spacing="3" fill="#A78BFA">BACKEND.EXE</text>
  <rect x="295" y="92" width="600" height="5" fill="#233750"/>
  <rect x="295" y="92" width="230" height="5" fill="#22D3EE"/>
  <text x="292" y="144" font-family="'Courier New',monospace" font-weight="bold" font-size="34" letter-spacing="1.7" fill="#F0F6FC">PHAM MINH SANG</text>
  <text x="293" y="187" font-family="'Courier New',monospace" font-weight="bold" font-size="23" letter-spacing="1.2" fill="#22D3EE">&gt; C# / ASP.NET CORE / SQL</text>
  <text x="293" y="228" font-family="'Courier New',monospace" font-size="18" letter-spacing="1" fill="#9CA3AF">BUILD  //  TEST  //  DEPLOY  //  REPEAT</text>
  <rect x="295" y="248" width="445" height="18" fill="#15273a" stroke="#34556a" stroke-width="2"/>
  <rect x="298" y="251" width="291" height="12" fill="#22c55e"/>
  <text x="750" y="261" font-family="monospace" font-size="17" fill="#22c55e" font-weight="bold">LV.01</text>

  <!-- Data flow connections: API -> DB -->
  <g stroke="#22D3EE" stroke-width="5" fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M915 97 H944 V122 H974"/>
    <path d="M915 199 H944 V175 H974"/>
  </g>
  <rect x="942" y="117" width="11" height="11" fill="#22c55e"/>
  <rect x="940" y="171" width="11" height="11" fill="#A78BFA"/>

  <!-- Geometric DB sprite -->
  <rect x="981" y="83" width="177" height="155" fill="#0b1b2d" stroke="#A78BFA" stroke-width="5"/>
  <rect x="1004" y="107" width="130" height="23" fill="#22D3EE"/>
  <rect x="1004" y="132" width="130" height="32" fill="#12334c" stroke="#22D3EE" stroke-width="3"/>
  <rect x="1004" y="170" width="130" height="28" fill="#12334c" stroke="#22D3EE" stroke-width="3"/>
  <rect x="1017" y="144" width="12" height="10" fill="#22c55e"/>
  <rect x="1037" y="144" width="12" height="10" fill="#A78BFA"/>
  <rect x="1017" y="179" width="12" height="10" fill="#22c55e"/>
  <rect x="1037" y="179" width="12" height="10" fill="#A78BFA"/>
  <text x="1024" y="221" font-family="monospace" font-weight="bold" font-size="16" letter-spacing="3" fill="#22c55e">DB: OK</text>
  <text x="1000" y="68" font-family="monospace" font-size="15" fill="#9CA3AF">DATA_NODE_01</text>
  <text x="989" y="260" font-family="monospace" font-size="14" fill="#A78BFA">[ 200 OK ]</text>

  <rect width="1200" height="300" fill="url(#crt)" pointer-events="none"/>
</svg>
